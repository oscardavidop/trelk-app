# ============================================================
# Trelk Mini App — Docker Compose
# ============================================================
# Desarrollo: docker compose up
# Producción: docker compose -f docker-compose.yml up -d
# ============================================================

services:
  # === Backend NestJS ===
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trelk-app
    restart: unless-stopped
    ports:
      - "${PORT:-3008}:3008"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3008/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
    networks:
      - trelk-network

  # === Redis para sesiones y caché ===
  redis:
    image: redis:7-alpine
    container_name: trelk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - trelk-network

  # === Nginx reverse proxy (producción) ===
  nginx:
    image: nginx:alpine
    container_name: trelk-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - trelk-network

  # === Moderation Worker Microservice (BullMQ) ===
  moderation-worker:
    build:
      context: ../moderation-worker
      dockerfile: Dockerfile
    container_name: trelk-moderation-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      - trelk-network

volumes:
  redis-data:
    driver: local

networks:
  trelk-network:
    driver: bridge

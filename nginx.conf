# ============================================================
# Nginx — Reverse Proxy para Trelk Mini App
# ============================================================
# Optimizado para +1M DAU con rate limiting, caching y compresión
# ============================================================

upstream trelk_backend {
    # Pool de servidores NestJS (escalar con más instancias)
    server app:3008;
    keepalive 64;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;

# Cache para respuestas estáticas
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=24h;

server {
    listen 80;
    server_name app.trelk.site;

    # Redirect HTTP → HTTPS en producción
    # return 301 https://$server_name$request_uri;

    # === Compresión ===
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # === Security Headers ===
    add_header X-Frame-Options "ALLOWALL" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # === Archivos estáticos con cache largo ===
    location /public/ {
        limit_req zone=static burst=50 nodelay;
        proxy_pass http://trelk_backend;
        proxy_cache static_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
        expires 1d;
    }

    location /assets/ {
        limit_req zone=static burst=50 nodelay;
        proxy_pass http://trelk_backend;
        proxy_cache static_cache;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    # === Auth endpoints (rate limit estricto) ===
    location /users/api {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://trelk_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /auth {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://trelk_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # === Health checks (sin rate limit) ===
    location /health {
        proxy_pass http://trelk_backend;
        access_log off;
    }

    # === API docs (solo dev) ===
    location /api/docs {
        proxy_pass http://trelk_backend;
        proxy_set_header Host $host;
    }

    # === Todo lo demás ===
    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://trelk_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Requested-With $http_x_requested_with;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # === Bloquear rutas sensibles ===
    location ~ /\. {
        deny all;
        return 404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
}

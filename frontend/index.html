<body class="bg-tg-bg text-tg-text font-sans antialiased">
  <div id="root"></div>

<script type="text/javascript">
  (function() {
    const originalFetch = window.fetch;
    // const URI_BASE = 'https://api.trelk.site';

    window.fetch = async (input, init) => {
      // 1. Manejar si el input es un string o un objeto Request
      let url = typeof input === 'string' ? input : input.url;
      
      // 2. Solo añadir la base si la URL es relativa (empieza con /)
      // if (url.startsWith('/')) {
      //   url = `${URI_BASE}${url}`;
      // }

      try {
        const response = await originalFetch(url, init);

        // 3. Manejo de 401 sin bucle infinito
        if (response.status === 401) {
          console.warn("Sesión expirada. Redirigiendo...");
          // En lugar de reload, mejor redirigir a login o limpiar token
          // window.location.href = '/login'; 
          return response; 
        }

        return response;
      } catch (error) {
        console.error("Error en fetch interceptor:", error);
        throw error;
      }
    };
  })();
</script>

  <script type="module" src="/src/main.tsx"></script>

</body>

</html>

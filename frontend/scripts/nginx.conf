# # api.trelk.site
# api.trelk.site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.trelk.site;

    ssl_certificate /etc/letsencrypt/live/trelk.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trelk.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # 2. SE MANTIENE: Aquí Nginx le pasa el tráfico de forma interna a tu backend que corre en el 8443
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# prod
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name app-dev.trelk.site;
    client_max_body_size 40M;
    ssl_certificate /etc/letsencrypt/live/trelk.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trelk.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # FRONTEND
    root /home/tom/app/frontend/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass https://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }
}
